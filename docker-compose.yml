services:
  logistics-crm:
    build: .
    container_name: logistics-crm
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: coal-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: coal_logistics_compliance
      POSTGRES_USER: coal_logistics
      POSTGRES_PASSWORD: Lekker_Braai05
      N8N_WEBHOOK_URL: http://coal-n8n:5678/webhook/bc-job-created
      WEBHOOK_SECRET: your_webhook_secret_here

    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    external: true
    name: brandflow-network

